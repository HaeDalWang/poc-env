controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
server:
  httproute:
    enabled: true
    hostnames:
    - ${hostname}
    parentRefs:
    - name: ${gateway_name}
      namespace: ${gateway_namespace}
      sectionName: ${gateway_listener}
configs:
  secret:
    argocdServerAdminPassword: ${server_admin_password}
  params:
    "server.insecure": true

# ==============================================================================
# 배포 실패 -> kagent 자동 조사 배선
# ==============================================================================
# notifications 컨트롤러는 차트 기본값(notifications.enabled=true)으로 이미 떠 있었지만
# triggers/templates/notifiers가 전부 비어 있어서 놀고 있었음. 여기서 실제 배선을 넣음.
#
# 경로: Argo CD notifications -> kagent-alert-relay -> k8s-allinone-agent
# Alertmanager가 쓰는 릴레이를 그대로 재사용함. 릴레이는 발신자를 가리지 않고
# jsonrpc 문자열 보정 + 즉시 202 응답만 하므로 코드 수정 없이 그대로 물림
# (kagent-alert-relay.tf 주석의 버그 1/2 참고).
#
# ConfigMap 매핑 규칙(차트 templates/argocd-configs/argocd-notifications-cm.yaml 확인):
# notifiers/templates/triggers의 키가 argocd-notifications-cm에 그대로 들어가므로
# 키 이름을 service./template./trigger. 접두사까지 직접 써야 함.
notifications:
  # 알림 본문에 넣을 Argo CD 대시보드 주소. 안 주면 global.domain 기반 기본값
  # (argocd.example.com)이 들어가서 에이전트가 죽은 링크를 Slack에 보냄.
  argocdUrl: https://${hostname}

  notifiers:
    # service.<type>.<name> -> serviceType=webhook, name=kagent
    # (notifications-engine pkg/api/config.go:108-117 파싱 규칙)
    # 따라서 아래 subscriptions의 recipient와 template의 webhook 키는 둘 다 "kagent".
    service.webhook.kagent: |
      url: ${kagent_relay_url}
      headers:
      - name: Content-Type
        value: application/json

  templates:
    # 싱크 자체가 실패한 경우. 트리거 조건이 operationState != nil을 보장하므로
    # operationState 하위 필드를 안전하게 참조할 수 있음.
    # 모든 값은 sprig toJson으로 감쌈 — operationState.message에는 따옴표와 줄바꿈이
    # 그대로 들어와서 날것으로 넣으면 JSON 본문이 깨짐
    # (notifications-engine이 sprig.TxtFuncMap을 통째로 등록하므로 toJson 사용 가능).
    template.kagent-argocd-sync-failed: |
      webhook:
        kagent:
          method: POST
          body: |
            {
              "jsonrpc": "2.0",
              "id": {{ printf "argocd-sync-failed-%s-%s" .app.metadata.name .app.status.operationState.startedAt | toJson }},
              "method": "message/send",
              "params": {
                "message": {
                  "kind": "message",
                  "role": "user",
                  "messageId": {{ printf "argocd-sync-failed-%s-%s" .app.metadata.name .app.status.operationState.startedAt | toJson }},
                  "parts": [
                    {
                      "kind": "text",
                      "text": {{ printf "An Argo CD sync has FAILED. Investigate the root cause and follow your workflow: fix it yourself if it is low-risk and reversible, otherwise stop and escalate to a human via Slack.\n\n- Application: %s\n- Argo CD namespace: %s\n- Destination namespace: %s\n- Sync status: %s\n- Operation phase: %s\n- Started at: %s\n- Argo CD error: %s\n- Argo CD UI: %s/applications/%s" .app.metadata.name .app.metadata.namespace .app.spec.destination.namespace .app.status.sync.status .app.status.operationState.phase .app.status.operationState.startedAt (.app.status.operationState.message | default "(no message)") .context.argocdUrl .app.metadata.name | toJson }}
                    }
                  ]
                }
              }
            }

    # 싱크는 성공했는데 워크로드가 안 뜨는 경우(잘못된 이미지, readiness 실패 등).
    # 이때는 operationState가 nil일 수 있어서 그 하위 필드를 일절 참조하지 않음 —
    # 대신 식별 정보만 넘기고 나머지는 에이전트가 직접 조회하게 둠.
    template.kagent-argocd-degraded: |
      webhook:
        kagent:
          method: POST
          body: |
            {
              "jsonrpc": "2.0",
              "id": {{ printf "argocd-degraded-%s-%s" .app.metadata.name .app.status.sync.revision | toJson }},
              "method": "message/send",
              "params": {
                "message": {
                  "kind": "message",
                  "role": "user",
                  "messageId": {{ printf "argocd-degraded-%s-%s" .app.metadata.name .app.status.sync.revision | toJson }},
                  "parts": [
                    {
                      "kind": "text",
                      "text": {{ printf "An Argo CD application is DEGRADED after a successful sync — the manifests applied cleanly but the workload is not healthy. Investigate the root cause and follow your workflow: fix it yourself if it is low-risk and reversible, otherwise stop and escalate to a human via Slack.\n\n- Application: %s\n- Argo CD namespace: %s\n- Destination namespace: %s\n- Sync status: %s\n- Synced revision: %s\n- Argo CD UI: %s/applications/%s" .app.metadata.name .app.metadata.namespace .app.spec.destination.namespace .app.status.sync.status .app.status.sync.revision .context.argocdUrl .app.metadata.name | toJson }}
                    }
                  ]
                }
              }
            }

  triggers:
    # 공식 카탈로그(argoproj/argo-cd notifications_catalog/triggers)의 조건을 그대로 쓰고
    # send 대상만 우리 템플릿으로 교체.
    #
    # oncePer가 중요함: 같은 리비전에 대해선 몇 번 실패하든 한 번만 발송됨.
    # Alertmanager에서 겪었던 "같은 장애로 세션이 여러 개 생기는" 문제를 Argo CD 쪽에서는
    # 이 필드가 막아줌. ?. 는 expr-lang의 옵셔널 체이닝 — syncResult가 없어도 안전.
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        description: Application syncing has failed
        send: [kagent-argocd-sync-failed]
        oncePer: app.status.operationState?.syncResult?.revision

    # 카탈로그 원본에 "and sync.status == 'Synced'" 조건을 추가함.
    # 원본 그대로 두면 싱크 실패 시 health도 Degraded로 떨어지면서 위 트리거와 동시에
    # 발사되어 같은 장애에 세션이 두 개 생김. 이 가드로 "싱크는 됐는데 안 뜨는" 경우로만 좁힘.
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded' and app.status.sync.status == 'Synced'
        description: Application is degraded despite a successful sync
        send: [kagent-argocd-degraded]
        oncePer: app.status.sync.revision

  # 앱마다 annotation을 달지 않아도 되도록 전역 구독으로 설정.
  # recipient는 서비스 이름 그대로 "kagent" (webhook: 접두사 아님 —
  # config.go:47에서 recipient를 ":"로 split해 첫 조각을 서비스 이름으로 씀).
  subscriptions:
  - recipients:
    - kagent
    triggers:
    - on-sync-failed
    - on-health-degraded
