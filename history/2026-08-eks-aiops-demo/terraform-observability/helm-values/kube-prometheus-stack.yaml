fullnameOverride: prometheus
prometheus:
  prometheusSpec:
    externalUrl: https://${thanos_hostname}
    externalLabels:
      cluster: "${cluster_name}"
    disableCompaction: true
    retention: 6h
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    thanos:
      objectStorageConfig:
        existingSecret:
          name: ${thanos_objconfig_secret_name}
          key: thanos.yml
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
alertmanager:
  config:
    route:
      receiver: kagent
      group_by:
      - namespace
      routes:
      - receiver: 'null'
        matchers:
        - alertname = "KubeletTooManyPods"
    receivers:
    - name: 'null'
    - name: kagent
      webhook_configs:
      - url: ${kagent_a2a_url}
        send_resolved: true
        payload:
          jsonrpc: "2.0"
          method: message/send
          params:
            message:
              kind: message
              role: user
              parts:
              - kind: text
                text: '{{ template "kagent.text" . }}'
              messageId: '{{ .CommonLabels.alertname }}-{{ .Status }}-{{ (index .Alerts 0).Fingerprint }}'
          id: '{{ .CommonLabels.alertname }}-{{ (index .Alerts 0).Fingerprint }}'
  templateFiles:
    kagent.tmpl: |-
      {{/* Instruction sent to the kagent k8s-allinone-agent */}}
      {{ define "kagent.text" -}}
      A Kubernetes cluster alert has {{ if eq .Status "firing" }}fired{{ else }}resolved{{ end }}. Investigate the root cause and follow your workflow: fix it yourself if it's low-risk and reversible, otherwise stop and escalate to a human via Slack.

      - Alert: {{ .CommonLabels.alertname }}
      - Status: {{ .Status }}
      - Severity: {{ .CommonLabels.severity }}
      - Namespace: {{ .CommonLabels.namespace }}
      {{- if .CommonAnnotations.summary }}
      - Summary: {{ .CommonAnnotations.summary }}
      {{- end }}
      {{- range .Alerts }}
      {{- if .Annotations.description }}
      - Description: {{ .Annotations.description }}
      {{- end }}
      {{- if .Annotations.runbook_url }}
      - Runbook: {{ .Annotations.runbook_url }}
      {{- end }}
      {{- end }}
      {{- end }}
  route:
    main:
      enabled: true
      hostnames:
      - ${alertmanager_hostname}
      parentRefs:
      - name: ${gateway_name}
        namespace: ${gateway_namespace}
        sectionName: ${gateway_listener}
grafana:
  adminPassword: admin
  # Grafana는 사용자/서비스 계정/토큰을 내장 SQLite(/var/lib/grafana/grafana.db)에 담는데
  # 기본값이 emptyDir이라 파드가 새로 뜰 때마다 통째로 초기화된다. 실제로 이 values를
  # 수정해 재배포한 것만으로 발급해둔 kagent용 서비스 계정 토큰이 사라져서 mcp-grafana가
  # 401을 맞았음(2026-08-12). 토큰을 코드로 만들 방법이 없으니 DB를 보존하는 쪽으로 해결.
  persistence:
    enabled: true
    type: pvc
    size: 5Gi
    accessModes:
    - ReadWriteOnce
    storageClassName: ebs
  # PVC(EBS)는 ReadWriteOnce라 RollingUpdate로는 새 파드가 볼륨을 못 붙어 Pending에 걸린다
  # (기존 파드가 아직 잡고 있음). 반드시 Recreate여야 함.
  deploymentStrategy:
    type: Recreate
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  sidecar:
    datasources:
      name: Thanos
      uid: thanos
      url: http://thanos-query.monitoring.svc.cluster.local:9090
  additionalDataSources:
  # uid를 명시적으로 박아둠 — 안 주면 Grafana가 랜덤 uid를 만들어버리는데, kagent 에이전트가
  # query_loki_logs를 호출하려면 datasourceUid를 알아야 한다. 랜덤이면 systemMessage에
  # 못 박을 수가 없어서 에이전트가 매번 데이터소스 목록부터 뒤져야 함
  # (prometheus_* 도구에 prometheus_url을 매번 명시하게 한 것과 같은 이유).
  - name: loki
    type: loki
    uid: loki
    url: http://loki-gateway.logging.svc.cluster.local
  - name: tempo
    type: tempo
    url: http://tempo-query-frontend.tracing.svc.cluster.local:3200
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      gateway-api-gatewayclasses:
        gnetId: 19432
        revision: 1
      gateway-api-gateways:
        gnetId: 19433
        revision: 1
      gateway-api-httproutes:
        gnetId: 19434
        revision: 1
      karpenter-capacity-dashboard:
        url: https://karpenter.sh/v1.12/getting-started/getting-started-with-karpenter/karpenter-capacity-dashboard.json
      karpenter-performance-dashboard:
        url: https://karpenter.sh/v1.12/getting-started/getting-started-with-karpenter/karpenter-performance-dashboard.json
      envoy-clusters:
        url: https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-addons-helm/dashboards/envoy-clusters.json
      envoy-proxy-global:
        url: https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
  route:
    main:
      enabled: true
      hostnames:
      - ${grafana_hostname}
      parentRefs:
      - name: ${gateway_name}
        namespace: ${gateway_namespace}
        sectionName: ${gateway_listener}
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        action: replace
        targetLabel: instance
      attachMetadata:
        node: true
  priorityClassName: system-node-critical
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: eks.amazonaws.com/compute-type
              operator: NotIn
              values:
                - fargate
kube-state-metrics:
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: gateway.networking.k8s.io
              kind: "Gateway"
              version: "v1"
            metricNamePrefix: gatewayapi_gateway
            labelsFromPath:
              name:
                - metadata
                - name
              namespace:
                - metadata
                - namespace
            metrics:
              - name: "info"
                help: "Gateway information"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      gatewayclass_name: [ spec, gatewayClassName ]
              - name: "labels"
                help: "Kubernetes labels converted to Prometheus labels."
                each:
                  type: Info
                  info:
                    path: [ metadata ]
                    labelsFromPath:
                      "*": [ labels ]
              - name: "created"
                help: "created timestamp"
                each:
                  type: Gauge
                  gauge:
                    path: [ metadata, creationTimestamp ]
              - name: "deleted"
                help: "deletion timestamp"
                each:
                  type: Gauge
                  gauge:
                    path: [ metadata, deletionTimestamp ]
              - name: "listener_info"
                help: "Gateway listener information"
                each:
                  type: Info
                  info:
                    path: [ spec, listeners ]
                    labelsFromPath:
                      listener_name: [ "name" ]
                      port: [ "port" ]
                      protocol: [ "protocol" ]
                      hostname: [ "hostname" ]
                      tls_mode: [ "tls","mode" ]
                      allowed_routes_namespaces_from: [ "allowedRoutes", "namespaces", "from" ]
              - name: "status"
                help: "status condition"
                each:
                  type: Gauge
                  gauge:
                    path: [ status, conditions ]
                    labelsFromPath:
                      type: [ "type" ]
                    valueFrom: [ "status" ]
              - name: "status_listener_attached_routes"
                help: "Number of attached routes for a listener"
                each:
                  type: Gauge
                  gauge:
                    path: [ status, listeners ]
                    labelsFromPath:
                      listener_name: [ "name" ]
                    valueFrom: [ "attachedRoutes" ]
              - name: "status_address_info"
                help: "Gateway address types and values"
                each:
                  type: Info
                  info:
                    path: [ status, addresses ]
                    labelsFromPath:
                      type: [ "type" ]
                      value: [ "value" ]
